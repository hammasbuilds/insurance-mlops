[project]
name = "insurance-mlops"
version = "0.1.0"
description = "Point-in-time feature store, training/serving skew detection, model cards, consent and a release gate that refuses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package lives in src/, so `pytest` from a fresh clone cannot import it
# without this. CI installs the package first, which hid the problem: CI was
# green while every clone failed at collection with ModuleNotFoundError.
pythonpath = ["src"]
